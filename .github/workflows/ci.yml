name: CI

on:
  push:
    branches: [juan-local, main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.prod.txt
          pip install pytest httpx pytest-timeout
      - name: Run tests
        run: python -m pytest tests/test_api.py -v --timeout=30 -x
        env:
          PYTHONPATH: .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: georisk-frontend/package-lock.json
      - name: Install dependencies
        working-directory: georisk-frontend
        run: npm install
      - name: Type check
        working-directory: georisk-frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: georisk-frontend
        run: npm run build
      - name: Test
        working-directory: georisk-frontend
        run: npx vitest run

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t georisk-v3 .
